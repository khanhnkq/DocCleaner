<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocCleaner Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-container">
    <!-- Header Block -->
    <header class="header-card">
      <div class="header-main">
        <div class="header-brand">
          <img src="icons/icon32.png" alt="DocCleaner Logo" class="header-logo" width="22" height="22">
          <h1 class="header-title">DocCleaner</h1>
        </div>
        <p class="header-sub" data-i18n="headerSub">Studocu & Scribd Helper</p>
      </div>
      <div class="header-right">
        <div class="lang-switch" id="langSwitch" title="Switch Language / Đổi Ngôn Ngữ">
          <span class="lang-opt" data-lang="vi">VN</span>
          <span class="lang-divider">/</span>
          <span class="lang-opt active" data-lang="en">EN</span>
        </div>
        <div class="header-badge">
          <span class="badge-tag">PRO</span>
          <span class="badge-ver">v1.3</span>
        </div>
      </div>
    </header>

    <!-- Uniform Cards List -->
    <main class="card-list">
      <!-- Item 1: Current Active Web Page -->
      <div class="card-item info-card">
        <div class="card-badge" id="status-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
        <div class="card-body">
          <span class="card-label" data-i18n="currentWebsite">Current Website</span>
          <span class="card-title" id="platform-name">Detecting...</span>
        </div>
      </div>

      <!-- Item 2: PDF Download Button -->
      <button id="checkBtn" class="card-item btn-card">
        <div class="card-badge lime-badge">
          <svg class="btn-icon-download" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          <svg class="btn-icon-spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity="0.25" stroke-width="2.8" fill="none"></circle>
            <path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2.8" fill="none"></path>
          </svg>
        </div>
        <div class="card-body">
          <span class="card-title" data-i18n="downloadPdfTitle">Download HD PDF (1-Click)</span>
          <span class="card-desc" id="pdf-btn-desc" data-i18n="downloadPdfDesc">Auto-preload pages & save as PDF</span>
        </div>
      </button>

      <!-- Item 3: Unblur & Ad-Cleaner -->
      <button id="clearBtn" class="card-item btn-card">
        <div class="card-badge green-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
        </div>
        <div class="card-body">
          <span class="card-title" data-i18n="unblurTitle">Unblur Pages & Remove Ads</span>
          <span class="card-desc" data-i18n="unblurDesc">Clear limit cookies & clean overlays</span>
        </div>
      </button>

      <!-- Item 4: Buy Me A Coffee Button -->
      <button id="coffeeBtn" class="card-item coffee-card">
        <div class="card-badge yellow-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8h1a4 4 0 0 1 0 8h-1" />
            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
            <line x1="6" y1="1" x2="6" y2="4" />
            <line x1="10" y1="1" x2="10" y2="4" />
            <line x1="14" y1="1" x2="14" y2="4" />
          </svg>
        </div>
        <div class="card-body">
          <span class="card-title" data-i18n="coffeeTitle">Buy the Author a Coffee</span>
          <span class="card-desc" data-i18n="coffeeDesc">Support ongoing development</span>
        </div>
      </button>
    </main>

    <!-- Footer Status Banner -->
    <div id="status" class="status-banner">
      <span class="status-dot"></span>
      <span id="status-text" data-i18n="statusReady">Ready</span>
    </div>

    <!-- Credit -->
    <footer class="footer-block">
      <span><span data-i18n="authorLabel">Author:</span> <strong class="author-name">Khanhnkq</strong></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
